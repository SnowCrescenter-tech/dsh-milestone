# pnpm 11 defaults minimumReleaseAge to 24h (supply-chain guard for freshly
# published packages). @deepseek-ai harness packages are published same-day,
# so relax the guard for this plugin's dependency set.
minimumReleaseAge: 0

# Pin one zod copy: the harness 0.1.2 line ships zod ^4.4.3 (its published
# ProjectionDefinition types are compiled against 4.4.3's ZodObject shape);
# forcing 4.5.4 produced a type mismatch. Every consumer gets 4.4.3.
overrides:
  zod: 4.4.3

# Upstream packaging bug in @deepseek-ai/dsh-client-store (still present in
# 0.1.5-rc.2): its lib/index.js imports zustand/vanilla + zustand/middleware +
# zustand/shallow and immer at runtime, but the manifest declares NEITHER (both
# sit in devDependencies; 0.1.2-rc.1 correctly declared them as real
# dependencies). Without this, every consumer of the package fails with
# "Cannot find package 'zustand'" the moment the store module is imported.
# Scoped to the 0.1.5 line so the workaround does not pin a future line that
# may have fixed its manifest.
packageExtensions:
  '@deepseek-ai/dsh-client-store@>=0.1.5-rc.1 <0.1.6-0':
    dependencies:
      zustand: ~4.4.7
      immer: ^10.1.1
